name: Edge function typecheck

# WHY (security audit 2026-09-04, open item 2):
# Edge functions are the only code in this repo with no type gate. `tsc` covers
# apps/mobile and packages/*, but supabase/functions/** is Deno — different
# runtime, different module resolution, not in any tsconfig. That is how a
# missing import reached a commit, and it is why the audit's symbol-resolution
# checks had to be re-run BY HAND after every bulk edit.
#
# The blocker was never Deno itself, it was that `deno check` walked up out of
# supabase/functions into the pnpm workspace and rewrote the root package.json
# trying to resolve npm: specifiers. `supabase/functions/deno.json` with
# `nodeModulesDir: none` is the fix — Deno stops at that config and keeps npm:
# in its own cache, the same way the deployed runtime does.

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-check.yml'
      # The job now shells out to this, so a change to it must re-run the job.
      # Omitting it would be the same defect as the CI path filter that skipped
      # itself on the commit that added its own tests.
      - 'scripts/retry-on-network-error.sh'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-check.yml'
      - 'scripts/retry-on-network-error.sh'
  workflow_dispatch:

jobs:
  check:
    name: deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # One `deno check` over every function at once, so a symbol that a
      # neighbouring file stopped exporting is caught here rather than at deploy
      # time. The file count is asserted non-empty first: a glob that matched
      # nothing would otherwise exit 0 and report a green check over zero files,
      # which is worse than having no check at all.
      #
      # NOTE: this is the exact pipeline that was run locally to take the tree
      # from 17 errors to 0 — deliberately not `mapfile`, which needs bash 4+ and
      # so cannot be verified on a macOS dev machine before it reaches CI.
      #
      # The specifiers ARE now all pinned to exact versions (2026-09-08), so this
      # job no longer drifts on an upstream release. What it still does — by
      # design — is resolve ~100 modules from esm.sh, jsr.io, deno.land and npm
      # on every run, because `supabase functions deploy` does not use a
      # lockfile and CI must check against what production actually resolves
      # (see .gitignore). That leaves one real failure mode: a single connection
      # reset anywhere in that fan-out reddens the job. Hence the retry wrapper,
      # which retries TRANSPORT failures only and lets a genuine type error fail
      # on the first attempt.
      - name: Type-check every edge function
        working-directory: supabase/functions
        run: |
          set -euo pipefail
          COUNT=$(find . -name '*.ts' -not -path './node_modules/*' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no .ts files found under supabase/functions — check the path"
            exit 1
          fi
          echo "Checking $COUNT files"
          find . -name '*.ts' -not -path './node_modules/*' -print0 \
            | sort -z \
            | xargs -0 ../../scripts/retry-on-network-error.sh 3 -- deno check

      # The gate unit tests. 214 lines in _shared decide access for 52 of the 75
      # functions, so they get the only real unit coverage in the backend.
      # --allow-net is for the local stub of the Supabase Auth endpoint that
      # user-auth_test.ts starts on a random port; nothing reaches the network.
      - name: Test the shared auth gates
        if: '!cancelled()'
        working-directory: supabase/functions
        run: ../../scripts/retry-on-network-error.sh 3 -- deno test --allow-env --allow-net _shared/
