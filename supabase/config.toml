# Supabase local dev config — https://supabase.com/docs/guides/cli/config
# NOTE: ports bumped +1000 in this worktree so its local Supabase stack can
# run alongside the main village-app directory's stack without colliding.
[api]
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
port = 55323

[inbucket]
port = 55324
smtp_port = 55325
pop3_port = 55326

[analytics]
port = 55327

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false
template = "Your The Village code is {{ .Code }}"

# ─────────────────────────────────────────────────────────────────────────────
# Edge Function JWT verification  (appsec 2026-08-14)
# docs/audits/security-privacy-2026-08-14.md
#
# `verify_jwt` used to live ONLY in whatever `--no-verify-jwt` flag someone
# happened to type at deploy time. It appeared in no file, so it could not be
# reviewed, diffed, or tested — a copy-pasted deploy command silently decided
# whether a function was authenticated. That is how `specialist-invite-create`
# ended up publicly callable with a forgeable admin gate. Pinning every
# function here makes the setting reviewable and makes drift show up as a diff.
#
# DEFAULT IS true. Set false ONLY for endpoints that genuinely cannot present a
# Supabase JWT, and only where the function authenticates the caller ITSELF
# (HMAC signature, shared secret, or an unguessable token).
#
# ⚠️ Functions using _shared/service-role.ts pass `gatewayVerifiesJwt` to that
# helper. That argument MUST match the value set here for the same function —
# if you flip one, flip the other.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Public by design (each authenticates its own caller) ───

# Pre-session OAuth code exchange — caller has no JWT yet, by definition
[functions.auth-google-exchange]
verify_jwt = false

# Calendly webhook — HMAC-signed (t=,v1=), fails closed
[functions.calendly-webhook]
verify_jwt = false

# Public caregiver day-sheet page — unguessable revocable share token
[functions.day-sheet-page]
verify_jwt = false

# Public OG/share metadata for link unfurls
[functions.manual-og]
verify_jwt = false

# Affiliate webhooks — per-network HMAC / IP allowlist
[functions.perks-redemption-webhook]
verify_jwt = false

# Resend webhook — full Svix HMAC + replay guard
[functions.resend-webhook]
verify_jwt = false

# RevenueCat webhook — shared bearer, fails closed on empty secret
[functions.revenuecat-webhook]
verify_jwt = false

# Anonymous invitee completing onboarding — the invite token IS the auth
[functions.specialist-invite-accept]
verify_jwt = false

# Stripe webhook — signature verified over the raw body
[functions.stripe-webhook]
verify_jwt = false

# External scheduled agent — TRENDING_INGEST_SECRET header
[functions.trending-ingest]
verify_jwt = false

# ─── Everything else: authenticated ───

[functions.account-delete]
verify_jwt = true

[functions.admin-approve-specialist]
verify_jwt = true

